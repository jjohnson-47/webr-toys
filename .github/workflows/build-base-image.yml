name: Build Base Image

# This workflow builds and publishes the hub-base image
# It runs on schedule and when base image files change

on:
  # Run weekly to get latest security updates
  schedule:
    - cron: '0 2 * * 1' # Every Monday at 2 AM UTC
  
  # Run when base image related files change
  push:
    branches:
      - main
      - development
    paths:
      - 'docker/hub-base/**'
      - '.github/workflows/build-base-image.yml'
  
  # Allow manual triggering
  workflow_dispatch:

jobs:
  build-base:
    runs-on: ubuntu-latest
    
    permissions:
      packages: write
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: docker/hub-base
          file: docker/hub-base/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/hub-base:latest
            ghcr.io/${{ github.repository }}/hub-base:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.description=Base image for webr-toys with agentic sidecar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign base image
        run: |
          echo "🔏 Signing base image..."
          cosign sign --yes ghcr.io/${{ github.repository }}/hub-base:latest
          cosign sign --yes ghcr.io/${{ github.repository }}/hub-base:${{ github.sha }}
          echo "✅ Base image signed successfully"

      - name: Update dependent workflows
        run: |
          echo "📢 Base image updated:"
          echo "  Latest: ghcr.io/${{ github.repository }}/hub-base:latest"
          echo "  SHA: ghcr.io/${{ github.repository }}/hub-base:${{ github.sha }}"
          echo ""
          echo "ℹ️  Dependent workflows will now use the updated base image"