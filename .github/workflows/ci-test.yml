name: CI-Test

on:
  push:
    branches:
      - mvp/**
      - development

jobs:
  test-r-setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libsodium-dev

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install required R packages
        shell: Rscript {0}
        run: |
          install.packages(c('plumber', 'httr', 'jsonlite', 'testthat', 'callr', 'httpuv', 'uuid', 'jsonvalidate', 'ggplot2'), repos = 'https://cloud.r-project.org')

      - name: Test R package loading
        shell: Rscript {0}
        run: |
          library(plumber)
          library(ggplot2)
          library(jsonlite)
          cat("✅ All R packages loaded successfully!\n")

      - name: Run contract tests only
        shell: Rscript {0}
        run: |
          if (dir.exists('tests/contract')) {
            testthat::test_dir('tests/contract')
          } else {
            cat("No contract tests found, skipping...\n")
          }