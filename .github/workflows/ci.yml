name: CI

on:
  push:
    branches:
      - mvp/**
      - development
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # System dependencies for building R packages
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libsodium-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/R
          key: r-pkgs-${{ runner.os }}-${{ hashFiles('**/DESCRIPTION') }}

      - name: Install R and deps
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install required R packages
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = 'https://cloud.r-project.org'))
          install.packages(c('plumber', 'httr', 'jsonlite', 'testthat', 'callr', 'httpuv', 'uuid', 'jsonvalidate', 'ggplot2'))
          
          # Verify packages are installed
          library(plumber)
          library(ggplot2)
          library(testthat)
          cat("✅ All R packages installed and loaded successfully!\n")

      - name: Run contract tests
        shell: Rscript {0}
        run: |
          testthat::test_dir('tests/contract')

      - name: Run unit tests
        shell: Rscript {0}
        run: |
          # Run non-contract tests (test files directly in tests/ directory)
          test_files <- list.files('tests', pattern = '^test.*[.]R$', full.names = TRUE)
          for (file in test_files) {
            cat("Testing:", file, "\n")
            testthat::test_file(file)
          }
          
      - name: Run all tests (final verification)
        shell: Rscript {0}
        run: |
          testthat::test_dir('tests')

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test base image availability
        run: |
          echo "🔍 Testing base image access..."
          if docker manifest inspect ghcr.io/jjohnson-47/hub-base:latest >/dev/null 2>&1; then
            echo "✅ Base image accessible, using main Dockerfile"
            echo "USE_FALLBACK=false" >> $GITHUB_ENV
          else
            echo "⚠️ Base image not accessible, using fallback Dockerfile"
            echo "USE_FALLBACK=true" >> $GITHUB_ENV
          fi

      - name: Build Docker image
        uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          file: ${{ env.USE_FALLBACK == 'true' && './Dockerfile.fallback' || './Dockerfile' }}
          push: false
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
          outputs: type=docker,dest=/tmp/image.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/image.tar
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Install cosign
        if: github.ref == 'refs/heads/development' || startsWith(github.ref, 'refs/heads/mvp/')
        uses: sigstore/cosign-installer@v3

      - name: Push and sign container image
        if: github.ref == 'refs/heads/development' || startsWith(github.ref, 'refs/heads/mvp/')
        run: |
          # Load and push the image
          docker load --input /tmp/image.tar
          docker push ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          
          # Sign the image
          cosign sign --yes ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
