name: CI

on:
  push:
    branches:
      - mvp/**
      - development
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # System dependencies for building R packages (libcurl)
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libsodium-dev

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/R
          key: r-pkgs-${{ runner.os }}-${{ hashFiles('**/DESCRIPTION') }}

      - name: Install R and deps
        uses: r-lib/actions/setup-r@v2

      - name: Install required R packages
        shell: Rscript {0}
        run: |
          install.packages(c('plumber', 'httr', 'jsonlite', 'testthat', 'callr'), repos = 'https://cloud.r-project.org')

      - name: Run unit tests
        shell: Rscript {0}
        run: |
          testthat::test_dir('tests')

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/development' || startsWith(github.ref, 'refs/heads/mvp/') }}
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
