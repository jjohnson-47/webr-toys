name: deploy-docs

on:
  push:
    branches:
      - development
      - main

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies for docs
        shell: Rscript {0}
        run: |
          install.packages(c('pkgdown', 'plumber', 'jsonlite', 'uuid'), repos = 'https://cloud.r-project.org')

      - name: Generate API documentation with pkgdown
        shell: Rscript {0}
        run: |
          # Create a basic DESCRIPTION file for pkgdown
          writeLines(c(
            "Package: webr-toys",
            "Title: R Web Toys Hub Integration",
            "Version: 0.1.0",
            "Description: A minimal R web API with hub integration for the agentic system.",
            "License: MIT",
            "URL: https://github.com/jjohnson-47/webr-toys",
            "BugReports: https://github.com/jjohnson-47/webr-toys/issues"
          ), "DESCRIPTION")
          
          # Create basic pkgdown config
          writeLines(c(
            "url: https://jjohnson-47.github.io/webr-toys/",
            "template:",
            "  bootstrap: 5",
            "home:",
            "  title: 'webr-toys'",
            "  description: 'R Web API with Hub Integration'",
            "navbar:",
            "  structure:",
            "    left: [home, reference, articles]",
            "    right: [github]",
            "  components:",
            "    github:",
            "      icon: fab-github",
            "      href: https://github.com/jjohnson-47/webr-toys"
          ), "_pkgdown.yml")
          
          # Build the site
          pkgdown::build_site()

      - name: Create API demo iframe
        run: |
          # Add demo iframe page
          mkdir -p docs/articles
          cat > docs/articles/demo.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>webr-toys API Demo</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 20px; }
              iframe { border: 1px solid #ccc; border-radius: 8px; }
              .demo-section { margin-bottom: 30px; }
            </style>
          </head>
          <body>
            <h1>webr-toys API Demo</h1>
            
            <div class="demo-section">
              <h2>/ping Endpoint</h2>
              <p>Health check endpoint that returns <code>{"status": "pong"}</code></p>
              <iframe src="about:blank" width="100%" height="200" id="ping-demo">
                <p>Your browser does not support iframes.</p>
              </iframe>
              <button onclick="testPing()">Test /ping</button>
            </div>
            
            <script>
              function testPing() {
                const iframe = document.getElementById('ping-demo');
                iframe.src = 'data:text/html,<html><body><h3>API Response:</h3><pre>{"status": "pong"}</pre><p><em>Note: This is a mock response. In production, this would call the actual API endpoint.</em></p></body></html>';
              }
            </script>
          </body>
          </html>
          EOF

      - name: Deploy to GH Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages

